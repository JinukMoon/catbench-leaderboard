name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Merge plot assets from 'plots' branch into dist/plots
        run: |
          if git fetch origin plots:plots --depth=1 2>/dev/null && git rev-parse --verify plots >/dev/null 2>&1; then
            git worktree add /tmp/plots plots
            mkdir -p dist/plots
            rsync -a --exclude='.git' /tmp/plots/ dist/plots/
            echo "Merged $(find dist/plots -name '*.webp' | wc -l) plot images into dist/plots"
          else
            echo "no 'plots' branch yet — skipping plot assets"
          fi

      - name: Merge benchmark JSONs from 'benchmark-data' branch into dist/benchmark
        run: |
          if git fetch origin benchmark-data:benchmark-data --depth=1 2>/dev/null && git rev-parse --verify benchmark-data >/dev/null 2>&1; then
            git worktree add /tmp/benchmark benchmark-data
            mkdir -p dist/benchmark
            rsync -a --exclude='.git' /tmp/benchmark/ dist/benchmark/
            echo "Merged $(find dist/benchmark -name '*.json.gz' | wc -l) benchmark JSONs into dist/benchmark"
          else
            echo "no 'benchmark-data' branch yet — skipping benchmark JSONs"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
