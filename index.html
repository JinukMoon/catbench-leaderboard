    <meta name="viewport" id="vp" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mobile-only: render the full desktop-width layout scaled DOWN (zoomed out)
      // so the wide leaderboard table is visible at a glance instead of the cramped
      // mobile reflow. Desktop browsers ignore the viewport meta, so they're unaffected.
      (function () {
        try {
          if (Math.min(screen.width, screen.height) <= 768) {
            document.getElementById('vp').setAttribute('content', 'width=1280');
          }
        } catch (e) {}
      })();
    </script>
